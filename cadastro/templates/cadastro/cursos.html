<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cursos</title>
</head>
<body>
    <h1>Cursos cadastrados</h1>
    <ul>
        {% for curso in cursos %}
            <li>
                <strong>{{ curso.titulo }}</strong>
                <p>{{ curso.descricao }}</p>
            </li>
        {% empty %}
            <li>Nenhum curso cadastrado.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'lista_alunos' %}">Ver alunos</a>
</body>
</html>
